services:
  ws-scrcpy:
    build: .
    image: ws-scrcpy:local
    init: true
    restart: unless-stopped
    ports:
      - "${WS_SCRCPY_PORT:-8000}:8000"
    environment:
      # Optional: comma-separated host[:port] to `adb connect` on startup.
      # Devices can also be connected later: `docker compose exec ws-scrcpy adb connect ...`
      ADB_CONNECT: ${ADB_CONNECT:-}
      # WS_SCRCPY_CONFIG: /config/config.yaml
    volumes:
      # adb RSA keys: devices don't ask to re-authorize after every rebuild
      - adb-keys:/root/.android
      # - ./config.yaml:/config/config.yaml:ro
    # 32-bit ARM hosts with an old Docker/libseccomp (< 2.4.2): the default
    # seccomp profile blocks the 64-bit time syscalls, and node/apt hang or fail
    # inside the container. Prefer updating the host; otherwise uncomment:
    # security_opt:
    #   - seccomp=unconfined

volumes:
  adb-keys:
